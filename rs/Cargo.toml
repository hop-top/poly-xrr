[package]
name = "hop-top-xrr"
version = "0.1.0-alpha.5"
edition = "2021"
license = "MIT"
description = "Multi-channel interaction recorder/replayer"
homepage = "https://hop.top/xrr"
repository = "https://github.com/hop-top/poly-xrr"
readme = "README.md"
include = [
    "src/**/*",
    "LICENSE",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "README.md",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

# Optional: the gRPC streaming adapter. tonic (and its prost/bytes/http
# companions) is a heavy transitive tree, and every other adapter in this
# port is dependency-free — so the seam ships behind a feature flag rather
# than as a hard dependency.
tonic = { version = "0.14", optional = true, default-features = false, features = ["codegen"] }
prost = { version = "0.14", optional = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }

[features]
default = []
grpc = ["dep:tonic", "dep:prost", "dep:bytes", "dep:http"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
tonic = { version = "0.14", features = ["server", "transport", "codegen", "router"] }
tower-service = "0.3"

[[test]]
name = "grpc_stream"
required-features = ["grpc"]

[[test]]
name = "grpc_stream_e2e"
required-features = ["grpc"]
