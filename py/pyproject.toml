[project]
name = "hop-top-xrr"
version = "0.1.0-alpha.6"
description = "Multi-channel interaction recorder/replayer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/xrr"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "LICENSE",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "README.md",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# protoc output is machine-generated and not ours to style.
extend-exclude = ["tests/grpcfixture/xrrtest_pb2.py", "tests/grpcfixture/xrrtest_pb2_grpc.py"]

[tool.pytest.ini_options]
# tests/ on sys.path so the generated gRPC stubs import as
# `grpcfixture.*` without a flat-layout sys.path hack in each test.
pythonpath = ["tests"]
