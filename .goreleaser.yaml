# Prebuilt `xrr` CLI binaries (go/cmd/xrr). Driven by the shared
# goreleaser-on-tag workflow on `xrr/v*` tags; see
# .github/workflows/goreleaser.yml. The workflow uploads the archives and
# checksums.txt to the release-please release, so GoReleaser's own release
# step stays disabled.
version: 2
project_name: xrr

builds:
  - id: xrr
    dir: go
    main: ./cmd/xrr
    binary: xrr
    env: [CGO_ENABLED=0]
    flags: [-trimpath, -buildvcs=false]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: xrr
    ids: [xrr]
    name_template: "xrr_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

release:
  disable: true
